    - name: 'CodeMD test 15/20: scripts/tests/test_remove_unused_docs_src.py'
      working-directory: ${{ github.workspace }}
      run: bash .codemd/run-test.sh 14
      timeout-minutes: 10
      continue-on-error: true
    - name: 'CodeMD test 16/20: tests/test_prepare_release.py'
      working-directory: ${{ github.workspace }}
      run: bash .codemd/run-test.sh 15
      timeout-minutes: 10
      continue-on-error: true
    - name: 'CodeMD test 17/20: scripts/tests/test_remove_unused_docs_src.py'
      working-directory: ${{ github.workspace }}
      run: bash .codemd/run-test.sh 16
