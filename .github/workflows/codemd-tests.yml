      timeout-minutes: 10
      continue-on-error: true
    - name: 'CodeMD test 10/20: docs_src/settings/app02/test_main.py'
      working-directory: ${{ github.workspace }}
      run: bash .codemd/run-test.sh 9
      timeout-minutes: 10
      continue-on-error: true
    - name: 'CodeMD test 11/20: docs_src/settings/app02_non_an/test_main.py'
      working-directory: ${{ github.workspace }}
