    - name: 'CodeMD test 20/20: tests/test_prepare_release.py'
      working-directory: ${{ github.workspace }}
      run: bash .codemd/run-test.sh 19
      timeout-minutes: 10
      continue-on-error: true
    - name: 'CodeMD: determine test result'
      if: always()
      working-directory: ${{ github.workspace }}
      run: bash .codemd/run-test.sh finalize
    - name: 'CodeMD: keep coverage reports'
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codemd-coverage-reports
        path: codemd-reports
        if-no-files-found: ignore
        retention-days: 90
